aid: stem
name: Stem AI
description: 'StemAI (Stem AI SAS) is a Paris-based accelerator and early-stage investment
  program for founders building LLM-powered products. Its stated thesis is that large
  language models are already capable enough to build great products today, so the program
  backs product and user experience rather than research breakthroughs. Each accepted
  company receives a $250,000 SAFE investment, $350,000 in partner cloud credits, recurring
  checkpoints with AI advisors, help accessing follow-on funding, and a founder summit
  hosted in Paris. The program is led by Nicolas Granatino, with a board that includes
  Mehdi Ghissassi (AI71) and Severine Gregoire (Zebox Ventures), and advisors in residence
  drawn from Hugging Face, Datadog, InstaDeep, Dust, Photoroom, Helsing, Nabla, QuantHouse
  and Parrot. StemAI is a private company whose shares are quoted on the secondary markets
  (Forge, Hiive, EquityZen). It publishes no API, SDK, developer portal or machine-readable
  specification of any kind.'
